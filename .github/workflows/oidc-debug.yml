
name: Debug AWS OIDC Authentication

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    name: Diagnose GitHub-to-AWS OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print GitHub workflow context
        shell: bash
        run: |
          echo "=== GitHub OIDC Diagnostic Context ==="
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Actor: ${GITHUB_ACTOR}"
          echo "Expected subject:"
          echo "repo:${GITHUB_REPOSITORY}:ref:${GITHUB_REF}"
          echo "Expected audience: sts.amazonaws.com"

      - name: Request OIDC token and inspect claims
        id: oidc
        shell: bash
        run: |
          set -euo pipefail

          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Missing OIDC request URL}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Missing OIDC request token}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -o "$response_file"

          export OIDC_JWT
          OIDC_JWT="$(python -c '
          import json, sys
          with open(sys.argv[1]) as f:
              print(json.load(f)["value"])
          ' "$response_file")"

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_JWT"]
          parts = token.split(".")

          if len(parts) != 3:
              raise SystemExit("Unexpected JWT format")

          payload = parts[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("=== Selected OIDC Claims ===")

          for key in (
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "ref",
              "event_name",
              "workflow",
              "job_workflow_ref",
          ):
              if key in claims:
                  print(f"{key}: {claims[key]}")

          print("Raw token and signature were not printed.")
          PY

          unset OIDC_JWT

      - name: Configure AWS credentials using OIDC
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: SitePulseOIDCDebug
          audience: sts.amazonaws.com

      - name: Verify assumed AWS identity
        if: steps.aws_auth.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Assumed AWS Identity ==="
          aws sts get-caller-identity

      - name: Report diagnostic result
        if: always()
        shell: bash
        env:
          OIDC_OUTCOME: ${{ steps.oidc.outcome }}
          AWS_AUTH_OUTCOME: ${{ steps.aws_auth.outcome }}
        run: |
          echo "OIDC token inspection: ${OIDC_OUTCOME:-not_run}"
          echo "AWS authentication: ${AWS_AUTH_OUTCOME:-not_run}"

          if [[ "${AWS_AUTH_OUTCOME:-}" == "success" ]]; then
            echo "AWS OIDC authentication succeeded."
          else
            echo "::warning::AWS OIDC authentication failed."
            echo "Inspect the Configure AWS credentials step above."
          fi
